[workspace]
name = "fungal-trans"
version = "0.1.0"
description = "A Snakemake workflow for fungal metatranscriptomics"
authors = ["johnne <john.sundh@scilifelab.se>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[system-requirements]
linux = "5.3.18"

[tasks]
init = "conda config --set channel_priority strict"

[dependencies]
python = "*"
conda = "*"
snakemake = ">9,<=9.13"
biopython = "*"
tqdm = "*"
pandas = "*"
polars = "*"
pyarrow = "*"
lxml = "*"
pycurl = "*"
pip = "*"
seqtk = "*"
seqkit = "*"
multiqc = "*"
ete3 = "*"
snakemake-executor-plugin-slurm = "*"
pigz = "*"
nextflow = ">=25.4.7,<26"
